x-qdrant: &qdrant-base
  image: qdrant/qdrant:latest

x-postgres: &postgres-base
  image: postgres:15
  environment:
    POSTGRES_DB: topix
    POSTGRES_USER: topix
    POSTGRES_HOST_AUTH_METHOD: trust

x-redis: &redis-base
  image: redis:7-alpine
  command: redis-server --appendonly yes

x-silero-tts: &silero-base
  image: navatusein/silero-tts-service:latest
  environment:
    LANGUAGE: ru
    SAMPLE_RATE: "48000"
    NUMBER_OF_THREADS: "4"
    SILERO_SETTINGS: '{"ru":{"model_link":"${TTS_MODEL_URL:-https://models.silero.ai/models/tts/ru/v5_6_ru.pt}","speakers":["aidar","baya","kseniya","xenia","eugene"]}}'

services:
  # -------- LOCAL PROFILE (DBs) --------
  qdrant-local:
    <<: *qdrant-base
    container_name: qdrant-local
    profiles: ["local"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data_local:/qdrant/storage

  postgres-local:
    <<: *postgres-base
    container_name: postgres-local
    profiles: ["local"]
    ports:
      - "5432:5432"
    volumes:
      - pg_data_local:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "topix"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis-local:
    <<: *redis-base
    container_name: redis-local
    profiles: ["local"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  # -------- DEV PROFILE (DBs) --------
  qdrant-dev:
    <<: *qdrant-base
    container_name: qdrant-dev
    profiles: ["dev"]
    ports:
      - "6334:6333"   # host:container
    volumes:
      - qdrant_data_dev:/qdrant/storage

  postgres-dev:
    <<: *postgres-base
    container_name: postgres-dev
    profiles: ["dev"]
    ports:
      - "5433:5432"   # host:container
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "topix"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis-dev:
    <<: *redis-base
    container_name: redis-dev
    profiles: ["dev"]
    ports:
      - "6380:6379"   # host:container
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  qdrant-test:
    <<: *qdrant-base
    container_name: qdrant-test
    profiles: ["test"]
    ports:
      - "6335:6333"
    volumes:
      - qdrant_data_test:/qdrant/storage

  postgres-test:
    <<: *postgres-base
    container_name: postgres-test
    profiles: ["test"]
    ports:
      - "5434:5432"
    volumes:
      - pg_data_test:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "topix"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis-test:
    <<: *redis-base
    container_name: redis-test
    profiles: ["test"]
    ports:
      - "6381:6379"
    volumes:
      - redis_data_test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  qdrant-staging:
    <<: *qdrant-base
    container_name: qdrant-staging
    profiles: ["staging"]
    ports:
      - "6336:6333"
    volumes:
      - qdrant_data_staging:/qdrant/storage

  postgres-staging:
    <<: *postgres-base
    container_name: postgres-staging
    profiles: ["staging"]
    ports:
      - "5435:5432"
    volumes:
      - pg_data_staging:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "topix"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis-staging:
    <<: *redis-base
    container_name: redis-staging
    profiles: ["staging"]
    ports:
      - "6382:6379"
    volumes:
      - redis_data_staging:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  qdrant:
    <<: *qdrant-base
    container_name: qdrant
    profiles: ["prod"]
    ports:
      - "6337:6333"
    volumes:
      - qdrant_data_prod:/qdrant/storage

  postgres:
    <<: *postgres-base
    container_name: postgres
    profiles: ["prod"]
    ports:
      - "5436:5432"
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "topix"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis:
    <<: *redis-base
    container_name: redis
    profiles: ["prod"]
    ports:
      - "6383:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  # ===========================
  #       APP SERVICES
  # ===========================

  # ---- TTS service (Silero) ----
  # Single instance shared by all stages: the backend reaches it over the compose
  # network only, so no ports are published. Uncomment for local debugging:
  # ports:
  #   - "9898:9898"
  silero-tts:
    <<: *silero-base
    container_name: silero-tts
    profiles: ["local", "dev", "test", "staging", "prod"]
    volumes:
      - silero_models:/usr/app/models
      - silero_audios:/usr/app/audios
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9898/').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- Backend (LOCAL) ----
  backend-local:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: backend-local
    profiles: ["local"]
    volumes:
      - ../${ENVFILE:-.env}:/.env:ro
      - backend_data_local:/app/data
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8081}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant-local}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres-local}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis-local}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_SERVICE_URL: ${TTS_SERVICE_URL:-http://silero-tts:9898}
      TTS_VOICE: ${TTS_VOICE:-xenia}
      TTS_FORMAT: ${TTS_FORMAT:-wav}
      TTS_STREAMING: ${TTS_STREAMING:-false}
    command: ["python","-m","topix.api.app","--stage","local"]
    depends_on:
      postgres-local:
        condition: service_started
      qdrant-local:
        condition: service_started
      redis-local:
        condition: service_started
      silero-tts:
        condition: service_started
    ports:
      - "${API_PORT:-8081}:${API_PORT:-8081}"

  # ---- Frontend (LOCAL) ----
  webui-local:
    build:
      context: ..
      dockerfile: webui/Dockerfile
    container_name: webui-local
    profiles: ["local"]
    environment:
      # Used by FE runtime (see Dockerfile entrypoint template) to call API
      API_ORIGIN: ${API_ORIGIN:-http://localhost:${API_PORT:-8081}}
      VITE_BILLING_ENABLED: ${VITE_BILLING_ENABLED:-false}
      # Mini-app sandboxed iframe runtime — see mini-app-archi.md §6.1.
      # Both bundles read these from window.__APP_CONFIG__ at boot;
      # docker-entrypoint.sh substitutes them into config.js per-env.
      VITE_MINI_APP_ORIGIN: ${VITE_MINI_APP_ORIGIN:-}
      VITE_HOST_ORIGIN: ${VITE_HOST_ORIGIN:-http://localhost:${APP_PORT:-3000}}
    depends_on:
      - backend-local
    ports:
      - "${APP_PORT:-3000}:80"
      - "${MINI_APP_PORT:-5001}:5001"

  # ---- Backend (DEV) ----
  backend-dev:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: backend-dev
    profiles: ["dev"]
    volumes:
      - ../${ENVFILE:-.env}:/.env:ro
      - backend_data_dev:/app/data
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8081}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant-dev}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres-dev}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis-dev}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_SERVICE_URL: ${TTS_SERVICE_URL:-http://silero-tts:9898}
      TTS_VOICE: ${TTS_VOICE:-xenia}
      TTS_FORMAT: ${TTS_FORMAT:-wav}
      TTS_STREAMING: ${TTS_STREAMING:-false}
    command: ["python","-m","topix.api.app","--stage","dev"]
    depends_on:
      postgres-dev:
        condition: service_started
      qdrant-dev:
        condition: service_started
      redis-dev:
        condition: service_started
      silero-tts:
        condition: service_started
    ports:
      - "${API_PORT:-8081}:${API_PORT:-8081}"

  # ---- Frontend (DEV) ----
  webui-dev:
    build:
      context: ..
      dockerfile: webui/Dockerfile
    container_name: webui-dev
    profiles: ["dev"]
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://localhost:${API_PORT:-8081}}
      VITE_BILLING_ENABLED: ${VITE_BILLING_ENABLED:-false}
      VITE_MINI_APP_ORIGIN: ${VITE_MINI_APP_ORIGIN:-}
      VITE_HOST_ORIGIN: ${VITE_HOST_ORIGIN:-http://localhost:${APP_PORT:-5174}}
    depends_on:
      - backend-dev
    ports:
      - "${APP_PORT:-5174}:80"
      - "${MINI_APP_PORT:-5181}:5001"

  backend-test:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: backend-test
    profiles: ["test"]
    volumes:
      - ../${ENVFILE:-.env}:/.env:ro
      - backend_data_test:/app/data
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8082}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant-test}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres-test}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis-test}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_SERVICE_URL: ${TTS_SERVICE_URL:-http://silero-tts:9898}
      TTS_VOICE: ${TTS_VOICE:-xenia}
      TTS_FORMAT: ${TTS_FORMAT:-wav}
      TTS_STREAMING: ${TTS_STREAMING:-false}
    command: ["python","-m","topix.api.app","--stage","test"]
    depends_on:
      postgres-test:
        condition: service_started
      qdrant-test:
        condition: service_started
      redis-test:
        condition: service_started
      silero-tts:
        condition: service_started
    ports:
      - "${API_PORT:-8082}:${API_PORT:-8082}"

  webui-test:
    build:
      context: ..
      dockerfile: webui/Dockerfile
    container_name: webui-test
    profiles: ["test"]
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://localhost:${API_PORT:-8082}}
      VITE_BILLING_ENABLED: ${VITE_BILLING_ENABLED:-false}
      VITE_MINI_APP_ORIGIN: ${VITE_MINI_APP_ORIGIN:-}
      VITE_HOST_ORIGIN: ${VITE_HOST_ORIGIN:-http://localhost:${APP_PORT:-5175}}
    depends_on:
      - backend-test
    ports:
      - "${APP_PORT:-5175}:80"
      - "${MINI_APP_PORT:-5182}:5001"

  backend-staging:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: backend-staging
    profiles: ["staging"]
    volumes:
      - ../${ENVFILE:-.env}:/.env:ro
      - backend_data_staging:/app/data
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8083}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant-staging}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres-staging}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis-staging}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_SERVICE_URL: ${TTS_SERVICE_URL:-http://silero-tts:9898}
      TTS_VOICE: ${TTS_VOICE:-xenia}
      TTS_FORMAT: ${TTS_FORMAT:-wav}
      TTS_STREAMING: ${TTS_STREAMING:-false}
    command: ["python","-m","topix.api.app","--stage","staging"]
    depends_on:
      postgres-staging:
        condition: service_started
      qdrant-staging:
        condition: service_started
      redis-staging:
        condition: service_started
      silero-tts:
        condition: service_started
    ports:
      - "${API_PORT:-8083}:${API_PORT:-8083}"

  webui-staging:
    build:
      context: ..
      dockerfile: webui/Dockerfile
    container_name: webui-staging
    profiles: ["staging"]
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://localhost:${API_PORT:-8083}}
      VITE_BILLING_ENABLED: ${VITE_BILLING_ENABLED:-false}
      VITE_MINI_APP_ORIGIN: ${VITE_MINI_APP_ORIGIN:-}
      VITE_HOST_ORIGIN: ${VITE_HOST_ORIGIN:-http://localhost:${APP_PORT:-5176}}
    depends_on:
      - backend-staging
    ports:
      - "${APP_PORT:-5176}:80"
      - "${MINI_APP_PORT:-5183}:5001"

  backend-prod:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: backend-prod
    profiles: ["prod"]
    volumes:
      - ../${ENVFILE:-.env}:/.env:ro
      - backend_data_prod:/app/data
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8084}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_SERVICE_URL: ${TTS_SERVICE_URL:-http://silero-tts:9898}
      TTS_VOICE: ${TTS_VOICE:-xenia}
      TTS_FORMAT: ${TTS_FORMAT:-wav}
      TTS_STREAMING: ${TTS_STREAMING:-false}
    command: ["python","-m","topix.api.app","--stage","prod"]
    depends_on:
      postgres:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      silero-tts:
        condition: service_started
    ports:
      - "${API_PORT:-8084}:${API_PORT:-8084}"

  webui-prod:
    build:
      context: ..
      dockerfile: webui/Dockerfile
    container_name: webui-prod
    profiles: ["prod"]
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://localhost:${API_PORT:-8084}}
      VITE_BILLING_ENABLED: ${VITE_BILLING_ENABLED:-false}
      VITE_MINI_APP_ORIGIN: ${VITE_MINI_APP_ORIGIN:-}
      VITE_HOST_ORIGIN: ${VITE_HOST_ORIGIN:-http://localhost:${APP_PORT:-5177}}
    depends_on:
      - backend-prod
    ports:
      - "${APP_PORT:-5177}:80"
      - "${MINI_APP_PORT:-5184}:5001"

volumes:
  qdrant_data_local:
  pg_data_local:
  redis_data_local:
  qdrant_data_dev:
  pg_data_dev:
  redis_data_dev:
  qdrant_data_test:
  pg_data_test:
  redis_data_test:
  qdrant_data_staging:
  pg_data_staging:
  redis_data_staging:
  qdrant_data_prod:
  pg_data_prod:
  redis_data_prod:
  backend_data_local:
  backend_data_dev:
  backend_data_test:
  backend_data_staging:
  backend_data_prod:
  silero_models:
  silero_audios:
