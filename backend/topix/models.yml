# Model catalog.
#
# Two registries: `providers` (who serves a model + how it's called) and the
# model lists (`llm`, `embedding`). Each model is a canonical `id` plus an
# ordered list of `routes`; a route says which provider serves it and under
# what provider-specific model string. At runtime the resolver picks the first
# route whose provider key is present (see config/catalog.py).
#
# Adding a model = one entry here. No code change.
#
# OpenRouter routes use the `:nitro` throughput variant EXCEPT for proprietary
# OpenAI and Anthropic models (single-provider on OpenRouter; nitro adds nothing
# there). Open-weight models keep :nitro even when the slug is vendor-branded
# (e.g. `openai/gpt-oss-*`), since many providers serve them.

providers:
  # LLM providers. `prefix` is prepended to the route's model string to form the
  # call code consumed by agents/base.py ("openai/..." -> native client,
  # anything else -> LiteLLM).
  openai:     { key: OPENAI_API_KEY,     prefix: openai }
  openrouter: { key: OPENROUTER_API_KEY, prefix: openrouter }
  anthropic:  { key: ANTHROPIC_API_KEY,  prefix: anthropic }
  gemini:     { key: GEMINI_API_KEY,     prefix: gemini }
  mistral:    { key: MISTRAL_API_KEY,    prefix: mistral }
  deepseek:   { key: DEEPSEEK_API_KEY,   prefix: deepseek }
  # Custom OpenAI-compatible provider: key and endpoint both come from the
  # environment, so no address is hardcoded here. A provider that declares its
  # own base URL is called through the native client (agents/base.py), because
  # LiteLLM does not know custom providers.
  anymodel:   { key: ANYMODEL_API_KEY,   prefix: anymodel, base_url_env: ANYMODEL_BASE_URL }

  # Search / fetch providers. No `prefix` (never used as an LLM route); listed
  # here so the single resolver can also gate search/navigate availability.
  linkup:     { key: LINKUP_API_KEY }
  tavily:     { key: TAVILY_API_KEY }
  perplexity: { key: PERPLEXITY_API_KEY }
  exa:        { key: EXA_API_KEY }

llm:
  # `vision: true` marks models that accept image input (multimodal). Every
  # USER-FACING model here is image-capable (verified against OpenRouter's
  # input_modalities), except the `anymodel` family — that provider has not
  # confirmed image input, so its models stay text-only. The other exception
  # is `gpt-oss-120b` — text-only and `internal: true` (the auto complexity
  # classifier only; excluded from public_llm_catalog so it never shows in the
  # picker, but still resolvable).

  # --- AnyModel (custom OpenAI-compatible provider) ---
  # Endpoint and key live in the environment (ANYMODEL_BASE_URL /
  # ANYMODEL_API_KEY). The provider serves the `cx/` model strings; image input
  # is not confirmed, so these entries stay text-only (`vision: false`).
  #
  # This block comes FIRST on purpose: `available_llms()` returns models in
  # catalog order and the first reachable one is the default model, so with
  # AnyModel configured the app answers with `cx/gpt-6-luna` — even when an
  # OpenRouter key is present.
  - id: gpt-6-luna
    label: GPT-6 Luna
    family: anymodel
    tier: lite
    vision: false
    routes:
      - { via: anymodel, model: cx/gpt-6-luna }
  - id: gpt-6-astra
    label: GPT-6 Astra
    family: anymodel
    tier: lite
    vision: false
    routes:
      - { via: anymodel, model: cx/gpt-6-astra }
  - id: gpt-6-1-sol
    label: GPT-6.1 Sol
    family: anymodel
    tier: lite
    vision: false
    routes:
      - { via: anymodel, model: cx/gpt-6-1-sol }
  - id: gpt-6-1-terra
    label: GPT-6.1 Terra
    family: anymodel
    tier: lite
    vision: false
    routes:
      - { via: anymodel, model: cx/gpt-6.1-terra }
  - id: gpt-5-6-luna
    label: GPT-5.6 Luna
    family: anymodel
    tier: lite
    vision: false
    routes:
      - { via: anymodel, model: cx/gpt-5.6-luna }

  # --- OpenAI (native preferred, OpenRouter fallback without :nitro) ---
  - id: gpt-5.5
    label: GPT-5.5
    family: openai
    tier: pro
    vision: true
    routes:
      - { via: openai,     model: gpt-5.5 }
      - { via: openrouter, model: openai/gpt-5.5 }
  - id: gpt-5.5-pro
    label: GPT-5.5 Pro
    family: openai
    tier: pro
    vision: true
    routes:
      - { via: openai,     model: gpt-5.5-pro }
      - { via: openrouter, model: openai/gpt-5.5-pro }
  - id: gpt-5.4
    label: GPT-5.4
    family: openai
    tier: pro
    vision: true
    routes:
      - { via: openai,     model: gpt-5.4 }
      - { via: openrouter, model: openai/gpt-5.4 }

  # --- Auto-routing base + classifier ---
  # `deepseek-v4.1-flash` is the first *lite* entry, so it's the normal/base auto
  # default (OpenRouter, nitro; falls through to gpt-5.4-mini with no OpenRouter
  # key). `gpt-oss-120b` is pinned as the complexity-classifier model in
  # auto_model.py (resolved by id, not tier order), so its position here does not
  # affect the base default. `gpt-5.5` stays the first entry overall → the no-tier
  # fallback + complex/pro default.
  - id: deepseek-v4.1-flash
    label: DeepSeek V4.1 Flash
    family: deepseek
    tier: lite
    vision: true
    routes:
      - { via: openrouter, model: deepseek/deepseek-v4.1-flash:nitro }
  # gpt-oss is OpenAI-branded but OPEN-WEIGHT and multi-provider on OpenRouter, so
  # (unlike proprietary openai/* models) it keeps :nitro to route to the fastest
  # provider — important for the latency-sensitive classifier. It is text-only and
  # `internal` (classifier only; hidden from the picker).
  - id: gpt-oss-120b
    label: GPT-OSS 120B
    family: openai
    tier: lite
    internal: true
    routes:
      - { via: openrouter, model: openai/gpt-oss-120b:nitro }

  # mini/nano inherit the GPT line's multimodality (the whole GPT-4o/4.1/5 family,
  # minis included, accepts image input).
  - id: gpt-5.4-mini
    label: GPT-5.4 Mini
    family: openai
    tier: lite
    vision: true
    routes:
      - { via: openai,     model: gpt-5.4-mini }
      - { via: openrouter, model: openai/gpt-5.4-mini }
  - id: gpt-5.4-nano
    label: GPT-5.4 Nano
    family: openai
    tier: lite
    vision: true
    routes:
      - { via: openai,     model: gpt-5.4-nano }
      - { via: openrouter, model: openai/gpt-5.4-nano }

  # --- Anthropic (native preferred, OpenRouter fallback without :nitro) ---
  - id: claude-opus-4.8
    label: Claude Opus 4.8
    family: anthropic
    tier: pro
    vision: true
    routes:
      - { via: anthropic,  model: claude-opus-4-8 }
      - { via: openrouter, model: anthropic/claude-opus-4.8 }
  - id: claude-sonnet-4.6
    label: Claude Sonnet 4.6
    family: anthropic
    tier: pro
    vision: true
    routes:
      - { via: anthropic,  model: claude-sonnet-4-6 }
      - { via: openrouter, model: anthropic/claude-sonnet-4.6 }
  - id: claude-haiku-4.5
    label: Claude Haiku 4.5
    family: anthropic
    tier: lite
    vision: true
    routes:
      - { via: anthropic,  model: claude-haiku-4-5 }
      - { via: openrouter, model: anthropic/claude-haiku-4.5 }

  # --- z-ai GLM (OpenRouter only) ---
  - id: glm-5.3-flashx
    label: GLM 5.3 FlashX
    family: z-ai
    tier: pro
    vision: true
    routes:
      - { via: openrouter, model: z-ai/glm-5.3-flashx:nitro }
  - id: glm-5.3-flash
    label: GLM 5.3 Flash
    family: z-ai
    tier: lite
    vision: true
    routes:
      - { via: openrouter, model: z-ai/glm-5.3-flash:nitro }

  # --- Google Gemma (OpenRouter only) ---
  - id: gemma-4-31b
    label: Gemma 4 31B
    family: google
    tier: lite
    vision: true
    routes:
      - { via: openrouter, model: google/gemma-4-31b-it:nitro }
  - id: gemma-4-26b
    label: Gemma 4 26B
    family: google
    tier: lite
    vision: true
    routes:
      - { via: openrouter, model: google/gemma-4-26b-a4b-it:nitro }

  # --- Qwen (OpenRouter only) ---
  - id: qwen3.6-plus
    label: Qwen3.6 Plus
    family: qwen
    tier: pro
    vision: true
    routes:
      - { via: openrouter, model: qwen/qwen3.6-plus:nitro }

  # --- Mistral (native preferred, OpenRouter fallback with :nitro) ---
  - id: mistral-medium-3.5
    label: Mistral Medium 3.5
    family: mistralai
    tier: lite
    vision: true
    routes:
      - { via: mistral,    model: mistral-medium-latest }
      - { via: openrouter, model: mistralai/mistral-medium-3-5:nitro }

  # --- Moonshot Kimi (OpenRouter only) ---
  - id: kimi-k3
    label: Kimi K3
    family: moonshotai
    tier: pro
    vision: true
    routes:
      - { via: openrouter, model: moonshotai/kimi-k3:nitro }


embedding:
  # Routes under one id MUST share `dim` (vectors are not cross-compatible).
  # openai-native and openrouter both serve text-embedding-3-small at dim 512.
  #
  # ORDER MATTERS: `available_embedding()` returns the FIRST reachable entry,
  # so the entry below is the active embedder whenever OpenRouter is
  # configured. It comes first because the Nemotron route honours the
  # `dimensions` parameter the embedder sends on every request (a 512-wide
  # vector, same width as the collection below — existing vectors stay valid).
  - id: nemotron-3.5-embed-1b
    label: NVIDIA Nemotron 3.5 Embed 1B (OpenRouter)
    family: openrouter
    dim: 512
    routes:
      - { via: openrouter, model: nvidia/nemotron-3.5-embed-1b:free }
  - id: text-embedding-3-small
    label: OpenAI text-embedding-3-small
    family: openai
    dim: 512
    routes:
      - { via: openai,     model: text-embedding-3-small }
      - { via: openrouter, model: openai/text-embedding-3-small }
